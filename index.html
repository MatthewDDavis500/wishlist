<!doctype html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Matthew's Wishlist</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>

<body>

        <nav class="category-grid" aria-label="Gift categories">

            <span class="category-description">Accessories for my devices</span>
            <span class="card-arrow" aria-hidden="true">→</span>

        <a class="category-card" href="category.html?category=candy">
            <span class="category-name">Candy</span>
            <span class="category-description">Tasty treats for my stomach</span>
            <span class="card-arrow" aria-hidden="true">→</span>

        <a class="category-card" href="category.html?category=bike">
            <span class="category-name">Bike</span>
            <span class="category-description">Improvements for my bike</span>
            <span class="card-arrow" aria-hidden="true">→</span>
        </a>
        <a class="category-card" href="category.html?category=currency">
            <span class="category-name">Subscriptions and Currency</span>
            <span class="category-description">Monetary-focused gifts for me</span>
